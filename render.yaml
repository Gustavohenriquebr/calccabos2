services:
  # Frontend React e API Node na mesma origem, a partir do GitHub.
  - type: web
    name: calccabos2
    repo: https://github.com/Gustavohenriquebr/calccabos2
    branch: main
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build:web
    startCommand: npm start
    healthCheckPath: /health/live
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PYTHON_SERVICE_URL
        value: https://calccabos2-python.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: calccabos
      - key: MONGODB_APP_NAME
        value: CalcCabos API
      - key: MONGODB_TLS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 7d
      - key: CORS_ORIGINS
        value: https://calccabos2.onrender.com
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5.6
      - key: AI_MAX_TOKENS
        value: "900"
      - key: AI_RATE_LIMIT
        value: "30"
      - key: AI_TIMEOUT_MS
        value: "45000"
      - key: PYTHON_CALC_TIMEOUT_MS
        value: "120000"
      - key: PYTHON_BATCH_CALC_TIMEOUT_MS
        value: "180000"
      - key: PYTHON_AGENT_TIMEOUT_MS
        value: "180000"
      - key: PYTHON_REPORT_TIMEOUT_MS
        value: "180000"
      - key: PYTHON_IMPORT_CALC_BATCH_SIZE
        value: "50"
      - key: IMPORT_CONFIRM_LOCK_TIMEOUT_MS
        value: "600000"

  # Backend Python/FastAPI: motor de calculo, relatorios legados e endpoints tecnicos.
  - type: web
    name: calccabos2-python
    repo: https://github.com/Gustavohenriquebr/calccabos2
    branch: main
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: DOCS_ENABLED
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        value: https://calccabos2.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_MODELS
        value: gemini-2.5-flash,gemini-2.0-flash
      - key: GROQ_MODELS
        value: llama-3.1-8b-instant
      - key: OPENROUTER_MODELS
        value: openrouter/free,nvidia/nemotron-3-super:free,openai/gpt-oss-120b:free
