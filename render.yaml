services:
  # Backend Node/Express: API publica consumida pelo frontend Vercel.
  - type: web
    name: calccabos-backend-node
    env: node
    plan: free
    rootDir: backend-node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Defina manualmente no Render Dashboard.
      # Preferencial (publico): https://SEU-BACKEND-PYTHON.onrender.com
      # Opcional (interno/private networking): URL interna do servico Python no mesmo region/workspace.
      - key: PYTHON_SERVICE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # Backend Python/FastAPI: motor de calculo, relatorios PDF/Excel e IA tecnica.
  - type: web
    name: calccabos-backend-python
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DOCS_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_MODELS
        value: gemini-2.5-flash,gemini-2.0-flash
      - key: GROQ_MODELS
        value: llama-3.1-8b-instant
      - key: OPENROUTER_MODELS
        value: openrouter/free,nvidia/nemotron-3-super:free,openai/gpt-oss-120b:free
