name: Build e Release CalcCabos

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instala dependências Python
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Empacota backend com PyInstaller
        working-directory: backend
        run: pyinstaller main.spec --clean

      - name: Instala dependências Node (raiz)
        run: npm ci

      - name: Instala dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Build do frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Build do instalador Electron
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
