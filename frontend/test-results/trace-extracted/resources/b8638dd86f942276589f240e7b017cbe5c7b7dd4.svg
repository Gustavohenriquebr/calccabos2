<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Deep petroleum-blue base (depth behind the video) -->
    <radialGradient id="base" cx="35%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#060D18"/>
      <stop offset="55%" stop-color="#070A0F"/>
      <stop offset="100%" stop-color="#04070C"/>
    </radialGradient>
    <!-- Subtle copper glow centre-left (where hero text lives) -->
    <radialGradient id="glow" cx="28%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#1A0D04" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#070A0F" stop-opacity="0"/>
    </radialGradient>
    <!-- Far circuit traces pattern -->
    <pattern id="circ" x="0" y="0" width="280" height="140" patternUnits="userSpaceOnUse">
      <path d="M0,70 L60,70 L80,50 L200,50 L220,70 L280,70" fill="none" stroke="#E2905B" stroke-width="0.4" stroke-opacity="0.14"/>
      <path d="M0,110 L40,110 L60,90 L180,90 L200,110 L280,110" fill="none" stroke="#E2905B" stroke-width="0.3" stroke-opacity="0.09"/>
      <circle cx="60" cy="70" r="1.5" fill="#E2905B" fill-opacity="0.2"/>
      <circle cx="200" cy="50" r="1.5" fill="#E2905B" fill-opacity="0.2"/>
      <circle cx="40" cy="110" r="1.2" fill="#E2905B" fill-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#circ)" opacity="0.9"/>
  <!-- Slight vignette -->
  <rect width="1920" height="1080" fill="radial-gradient(ellipse at center, transparent 40%, rgba(4,7,12,0.5) 100%)" opacity="0.6"/>
</svg>
