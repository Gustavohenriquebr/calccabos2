# Arquivo legado para deploy isolado do engine Python.
# Estrategia canonica do deploy web v1: usar /render.yaml na raiz do repositorio.
# Nao conecte este arquivo e o render.yaml da raiz ao mesmo ambiente Render.
services:
  - type: web
    name: calccabos-backend-python
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DOCS_ENABLED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
